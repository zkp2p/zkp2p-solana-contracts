[workspace]
members = ["."]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/zkp2p/zkp2p-solana-contracts"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"

[package]
name = "zkp2p-deployer"
version = "0.1.0"
description = "Latest-only deployment and topology verifier for ZKP2P Solana"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anchor-client = "=1.1.2"
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["associated_token", "token", "token_2022"] }
bincode = "=1.3.3"
clap = { version = "=4.6.6", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
solana-account = "=3.2.0"
solana-address = "=2.7.0"
solana-keypair = "=3.1.2"
solana-loader-v3-interface = { version = "=6.1.1", features = ["bincode"] }
solana-keccak-hasher = "=3.1.0"
solana-message = "=3.0.1"
solana-program = "=3.0.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"
zkp2p-solana = { path = "../programs/zkp2p_solana", features = ["no-entrypoint"] }

[lints]
workspace = true
