name: Solana CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.89.0
  CARGO_LLVM_COV_VERSION: 0.8.7
  CARGO_LLVM_COV_SHA256: 9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168

jobs:
  host:
    name: Host tests, lint, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default "$RUST_VERSION"
      - name: Restore host cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/ci-host
          key: ${{ runner.os }}-host-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: ${{ runner.os }}-host-${{ env.RUST_VERSION }}-
      - name: Install pinned coverage tool
        run: |
          archive="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CARGO_LLVM_COV_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" cargo-llvm-cov
          install -m 0755 "$RUNNER_TEMP/cargo-llvm-cov" "$HOME/.cargo/bin/cargo-llvm-cov"
      - name: Validate host code
        env:
          CARGO_TARGET_DIR: target/ci-host
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path deployment/Cargo.toml --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          bash -n scripts/*.sh .github/scripts/*.sh
          cargo test --workspace --lib
          cargo test -p zkp2p-solana --test fuzz_invariants
          mkdir -p target/coverage
          cargo llvm-cov --workspace --lib --lcov --output-path target/coverage/core.lcov
          python3 scripts/check-parity-coverage.py --coverage-only target/coverage/core.lcov
          cargo clippy --manifest-path deployment/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path deployment/Cargo.toml --all-targets

  sbf:
    name: SBF parity and release package
    runs-on: ubuntu-24.04
    # Bootstrap a branch-scoped SBF cache once; the next commit restores the
    # five-minute release gate and must pass against this exact program graph.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0
      - name: Install pinned Anchor and Agave
        run: .github/scripts/install-solana-toolchain.sh
      - name: Restore SBF cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/solana
            target
          key: ${{ runner.os }}-sbf-1.1.2-3.0.14-${{ hashFiles('Cargo.lock', 'Anchor.toml', 'programs/**/Cargo.toml', 'programs/**/*.rs') }}
          restore-keys: ${{ runner.os }}-sbf-1.1.2-3.0.14-
      - name: Build and execute every public instruction
        run: |
          anchor --version
          solana --version
          anchor build --no-idl
          env -u RUSTUP_TOOLCHAIN anchor idl build -p zkp2p_solana -o target/idl/zkp2p_solana.json
          python3 scripts/check-parity-coverage.py --idl-only
          cargo test -p zkp2p-solana --test parity_svm --test blind_foundry_svm
      - name: Build and verify release package
        run: scripts/build-release-package.sh --skip-build
      - name: Upload validated release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solana-release-candidate-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
