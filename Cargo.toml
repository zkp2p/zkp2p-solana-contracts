[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/zkp2p/zkp2p-solana-contracts"

[workspace.dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["associated_token", "token", "token_2022"] }
litesvm = "=0.10.0"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
solana-account = "=3.2.0"
solana-address = "=2.7.0"
solana-instruction = "=3.5.0"
solana-keypair = "=3.1.2"
solana-keccak-hasher = "=3.1.0"
solana-message = "=3.0.1"
solana-program = "=3.0.0"
solana-secp256k1-recover = "=3.3.0"
solana-signer = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-transaction = "=3.0.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
